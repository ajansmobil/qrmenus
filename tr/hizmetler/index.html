<script>
  if (typeof menu_slider_toggle === "undefined") {
    function menu_slider_toggle() {
      var root = document.getElementById("menu-slider-root");
      var overlay = document.getElementById("menu-slider-overlay");
      if (!root) {
        return;
      }
      var isOpen = root.classList.contains("h0000menu-open");
      if (isOpen) {
        root.classList.remove("h0000menu-open");
        if (overlay) {
          overlay.classList.remove("active");
          overlay.setAttribute("aria-hidden", "true");
        }
        document.body.style.overflow = "";
      } else {
        root.classList.add("h0000menu-open");
        if (overlay) {
          overlay.classList.add("active");
          overlay.setAttribute("aria-hidden", "false");
        }
        document.body.style.overflow = "hidden";
      }
    }
  }
  (function menuSliderOverlayInit() {
    setTimeout(function() {
      var overlay = document.getElementById("menu-slider-overlay");
      var root = document.getElementById("menu-slider-root");
      if (overlay && root) {
        overlay.addEventListener("click", function() {
          if (root.classList.contains("h0000menu-open")) {
            root.classList.remove("h0000menu-open");
            overlay.classList.remove("active");
            overlay.setAttribute("aria-hidden", "true");
            document.body.style.overflow = "";
          }
        });
      }
    }, 100);
  })();

  (function menuSliderInit() {
    var attempts = 0;
    var maxAttempts = 20;
    var timer = setInterval(function () {
      attempts++;
      if (typeof Swiper === "function") {
        clearInterval(timer);
        new Swiper(".h0000-slider", {
          slidesPerView: 1,
          spaceBetween: 30,
          loop: true,
          autoplay: {
            delay: "3000",
            disableOnInteraction: false,
          },
          pagination: {
            el: ".swiper-pagination",
            clickable: true,
          },
          navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
          },
        });
      } else if (attempts >= maxAttempts) {
        clearInterval(timer);
        console.warn("menu-slider: Swiper bulunamadı, slider başlatılamadı.");
      }
    }, 250);
  })();
</script>

    setTimeout(function() {
      var currentPath = window.location.pathname;
      var rtlLanguages = ['ar', 'he', 'fa'];
      var langMatch = currentPath.match(/^\/([a-z]{2})\//);
      var currentLang = langMatch ? langMatch[1] : '';
      if (rtlLanguages.indexOf(currentLang) !== -1) {
        document.documentElement.setAttribute('dir', 'rtl');
      } else {
        document.documentElement.setAttribute('dir', 'ltr');
      }
    }, 100);
